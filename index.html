<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Growth Rings — health tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='none' stroke='%2331d0aa' stroke-width='14'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>Growth Rings</h1>
      <p id="dateLine"></p>
    </div>
  </div>
  <div class="coin-chip" title="Coins available to invest">
    <span class="coin">◎</span><span id="coinBalance">0</span>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab is-active" data-view="today" role="tab">Today</button>
  <button class="tab" data-view="progress" role="tab">Progress</button>
  <button class="tab" data-view="invest" role="tab">Invest</button>
  <button class="tab" data-view="areas" role="tab">Areas</button>
</nav>

<main>
  <section id="view-today" class="view"></section>
  <section id="view-progress" class="view" hidden></section>
  <section id="view-invest" class="view" hidden></section>
  <section id="view-areas" class="view" hidden></section>
</main>

<footer class="foot">
  <p id="storageLine">Everything stays on this device (browser storage). Export a backup from the Areas tab.</p>
  <p class="fine">A personal tracker, not medical advice. Decisions about your ear, knee, shoulder, or teeth belong with your clinicians.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
