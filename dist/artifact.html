<title>Growth Rings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0e1418;
  --bg-2: #141c22;
  --card: #182229;
  --card-2: #1e2a32;
  --line: #26343d;
  --ink: #e8f0f3;
  --ink-2: #9fb2bd;
  --ink-3: #6d8492;
  --accent: #31d0aa;
  --gold: #f2c14e;
  --good: #4fd28b;
  --warn: #f0a04b;
  --bad: #ef6f6c;
  --radius: 16px;
  --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.28);
}

/* Dark is the resting state; light is the deliberate other half.
   Three viewer states are covered: no stamp (OS preference), an explicit
   light stamp, and an explicit dark stamp. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f4f7f8;
    --bg-2: #ffffff;
    --card: #ffffff;
    --card-2: #f1f5f7;
    --line: #dde5e9;
    --ink: #16232b;
    --ink-2: #566a76;
    --ink-3: #7d919d;
    --shadow: 0 1px 2px rgba(16,32,40,.06), 0 8px 20px rgba(16,32,40,.06);
  }
}
:root[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f7f8;
    --bg-2: #ffffff;
    --card: #ffffff;
    --card-2: #f1f5f7;
    --line: #dde5e9;
    --ink: #16232b;
    --ink-2: #566a76;
    --ink-3: #7d919d;
    --shadow: 0 1px 2px rgba(16,32,40,.06), 0 8px 20px rgba(16,32,40,.06);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
  padding-bottom: 48px;
}

main, .topbar, .tabs, .foot { max-width: 660px; margin: 0 auto; }
main { padding: 0 16px; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: max(14px, env(safe-area-inset-top)) 16px 10px;
}
.brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.coin-chip { cursor: pointer; }
.brand h1 { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 1px 0 0; font-size: 12px; color: var(--ink-3); }
.brand-mark {
  width: 26px; height: 26px; border-radius: 50%;
  border: 4px solid var(--accent);
  box-shadow: 0 0 0 3px var(--bg), 0 0 0 7px rgba(49,208,170,.22);
}
.coin-chip {
  font-family: var(--font-display);
  display: flex; align-items: center; gap: 6px;
  background: var(--card); border: 1px solid var(--line);
  padding: 7px 12px; border-radius: 999px;
  font-weight: 650; font-variant-numeric: tabular-nums;
}
.coin { color: var(--gold); font-size: 15px; }

/* ---------- tabs ---------- */
.tabs {
  display: flex; gap: 6px; padding: 4px;
  width: calc(100% - 32px); max-width: 628px; margin: 0 auto 16px;
  background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; appearance: none; border: 0; background: transparent;
  color: var(--ink-2); font: inherit; font-weight: 600; font-size: 13px;
  padding: 8px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap;
}
.tab.is-active { background: var(--card-2); color: var(--ink); box-shadow: var(--shadow); }

/* ---------- cards ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.card-head h2 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.card-head .sub { font-size: 12px; color: var(--ink-3); margin: 2px 0 0; }
.emoji { font-size: 20px; line-height: 1; }
h3.section { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 22px 0 10px; }

/* ---------- hero ---------- */
.hero { display: flex; align-items: center; gap: 18px; }
.hero-stats { flex: 1; min-width: 0; }
.hero-stats .big { font-family: var(--font-display); font-size: clamp(21px, 6vw, 29px); font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.hero-stats .label { font-size: 12px; color: var(--ink-3); }
.pillrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pill {
  font-size: 11.5px; padding: 4px 9px; border-radius: 999px;
  background: var(--card-2); border: 1px solid var(--line); color: var(--ink-2);
}
.pill.good { color: var(--good); border-color: rgba(79,210,139,.35); }
.pill.gold { color: var(--gold); border-color: rgba(242,193,78,.35); }

/* ---------- summary strip ---------- */
.summary {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 4px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.sum {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: none; border: 0; padding: 4px 2px; border-radius: 12px;
  color: inherit; font: inherit; cursor: pointer;
}
.sum:hover { background: var(--card-2); }
.sum-name {
  font-size: 11px; color: var(--ink-2); text-align: center;
  line-height: 1.25; max-width: 84px;
}
.summary .pct { font-size: 12.5px; }

/* ---------- rings ---------- */
.ring-wrap { position: relative; flex: none; }
.ring-wrap .ring-label {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
}
.ring-label .pct { font-family: var(--font-display); font-size: 21px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ring-label .pct.sm { font-size: 14px; }
.ring-track { stroke: var(--card-2); }
circle.ring-bar { transition: stroke-dashoffset .5s cubic-bezier(.22,.9,.3,1); }

/* ---------- area rows ---------- */
.area { border-left: 3px solid var(--accent); }
.area-top { display: flex; align-items: center; gap: 12px; }
.area-top .grow { flex: 1; min-width: 0; }
.area-top h2 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0; }
.area-top .sub { font-size: 12px; color: var(--ink-3); margin: 2px 0 0; }

.actions { list-style: none; margin: 12px 0 0; padding: 0; }
.actions li { border-top: 1px solid var(--line); }
.act {
  display: flex; align-items: center; gap: 11px; width: 100%;
  background: none; border: 0; color: inherit; font: inherit;
  padding: 11px 2px; text-align: left; cursor: pointer;
}
.box {
  flex: none; width: 22px; height: 22px; border-radius: 7px;
  border: 2px solid var(--line); display: grid; place-content: center;
  font-size: 13px; color: transparent; transition: all .15s ease;
}
.act.done .box { background: var(--accent); border-color: var(--accent); color: #06231d; }
.act.done .act-label { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-3); }
.act-label { flex: 1; min-width: 0; font-size: 14px; }
.act-meta { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.act-meta b { color: var(--gold); font-weight: 650; }

/* ---------- day tags ---------- */
.flags {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
}
.flag {
  font: inherit; font-size: 12px; line-height: 1.2;
  padding: 7px 12px; border-radius: 999px; cursor: pointer;
  background: transparent; border: 1px solid var(--line); color: var(--ink-3);
  transition: color .15s ease, background .15s ease;
}
.flag:hover { color: var(--ink-2); }
.flag.on { background: var(--card-2); color: var(--ink); font-weight: 600; }
.flag.on::before { content: "✓ "; }

.dot-lg { width: 10px; height: 10px; border-radius: 50%; flex: none; }

.subblock {
  border: 1px solid var(--line); border-radius: 12px;
  padding: 12px; margin-bottom: 10px; background: var(--bg-2);
}
.subblock .field { margin-bottom: 8px; }
select.f-kind {
  width: auto; flex: none; font-size: 12.5px; padding: 8px 10px;
}

/* ---------- metric slider ---------- */
.metric { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.metric-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.metric-head b { color: var(--ink); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }

textarea.s-text {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px; line-height: 1.5; background: var(--bg-2); color: var(--ink-2);
  white-space: pre; overflow-x: auto;
}

.metric-note { font-size: 11.5px; margin-top: 7px; font-weight: 600; }
.metric-note.bad { color: var(--bad); }
.metric-note.good { color: var(--good); }

/* ---------- bars / sparkline ---------- */
.bars { display: flex; align-items: stretch; gap: 4px; height: 76px; margin-top: 6px; }
.bars > div { flex: 1; height: 100%; background: var(--card-2); border-radius: 4px 4px 2px 2px; position: relative; overflow: hidden; }
.bars div span { position: absolute; inset: auto 0 0 0; background: var(--accent); border-radius: 4px 4px 2px 2px; }
.bars-x { display: flex; gap: 4px; margin-top: 6px; }
.bars-x span { flex: 1; text-align: center; font-size: 9.5px; color: var(--ink-3); }

.trend { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.trend .grow { flex: 1; min-width: 0; }
.trend .name { font-size: 13.5px; }
.trend .desc { font-size: 11.5px; color: var(--ink-3); }
.delta { font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); } .delta.flat { color: var(--ink-3); }

/* ---------- invest ---------- */
.inv { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.inv:first-child { border-top: 0; }
.inv .grow { flex: 1; min-width: 0; }
.inv .name { font-size: 14px; }
.inv .why { font-size: 11.5px; color: var(--ink-3); }
.cost { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 650; font-size: 13px; }

/* ---------- buttons & forms ---------- */
button.btn {
  appearance: none; font: inherit; font-weight: 620; font-size: 13px;
  padding: 8px 14px; border-radius: 10px; cursor: pointer;
  background: var(--card-2); color: var(--ink); border: 1px solid var(--line);
}
button.btn:hover { border-color: var(--ink-3); }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: #06231d; }
button.btn.ghost { background: transparent; color: var(--ink-3); }
button.btn:disabled { opacity: .45; cursor: not-allowed; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

input[type=text], input[type=number], textarea, select {
  width: 100%; font: inherit; font-size: 14px; color: var(--ink);
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 11px;
}
textarea { resize: vertical; min-height: 68px; }
label.field { display: block; margin-bottom: 10px; }
label.field span { display: block; font-size: 11.5px; color: var(--ink-3); margin-bottom: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; }
.row .grow { flex: 1; min-width: 0; }
input.w-coins, input.w-target { width: 62px; flex: none; text-align: center; }
input.w-emoji { width: 52px; flex: none; text-align: center; font-size: 17px; }
.row > .btn { flex: none; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.chk input { accent-color: var(--accent); width: 16px; height: 16px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.swatch.on { border-color: var(--ink); }

.muted { color: var(--ink-3); font-size: 12.5px; }
.empty { color: var(--ink-3); font-size: 13px; text-align: center; padding: 22px 8px; }

.foot { padding: 18px 16px 34px; color: var(--ink-3); font-size: 11.5px; }
.foot p { margin: 0 0 6px; }
.foot .fine { opacity: .8; }

/* sync state, shown only when the page can reach your account */
.sync {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--ink-3); margin-top: 10px;
}
.sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
.sync.on .dot { background: var(--good); }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- profiles ---------- */
.backlink {
  appearance: none; background: none; border: 0; cursor: pointer;
  font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-3);
  padding: 2px 0 10px;
}
.backlink:hover { color: var(--ink); }

.prof-head .area-top h2 { font-size: 18px; }

.area-link {
  display: flex; align-items: center; gap: 11px; width: 100%;
  background: none; border: 0; color: inherit; font: inherit;
  padding: 2px 0 10px; text-align: left; cursor: pointer;
}
.area-link .grow { flex: 1; min-width: 0; font-family: var(--font-display); font-size: 15px; font-weight: 600; }
.area-link .grow .name { display: block; font-family: var(--font-display); }
.area-link .grow .desc { display: block; font-family: var(--font-body); font-size: 11.5px; font-weight: 400; color: var(--ink-3); }
.area-link .muted { font-size: 12px; white-space: nowrap; }
.area-link:hover .muted { color: var(--ink); }

/* ---------- findings ---------- */
.finding {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; line-height: 1.5;
}
.finding:first-of-type { border-top: 0; padding-top: 2px; }
.finding .tone {
  flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 7px;
  background: var(--ink-3);
}
.finding .tone.good, .finding .tone.up { background: var(--good); }
.finding .tone.bad, .finding .tone.down { background: var(--bad); }

/* ---------- collapsible setup ---------- */
details.setup > summary {
  cursor: pointer; list-style: none; font-family: var(--font-display);
  font-size: 15px; font-weight: 600; color: var(--ink-2);
}
details.setup > summary::-webkit-details-marker { display: none; }
details.setup > summary::after { content: " ›"; color: var(--ink-3); }
details.setup[open] > summary::after { content: " ⌄"; }
details.setup > summary:hover { color: var(--ink); }
.setup-body { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.setup-body .card { box-shadow: none; }

/* ---------- journeys ---------- */
.goal { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); font-style: italic; }
.kicker { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); margin-bottom: 6px; }

.pathline { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-3); margin: -2px 0 2px; }
.pathline .dots { display: flex; gap: 4px; flex: none; }
.pathline .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: block; }

.feel { margin-top: 12px; }
.faces { display: flex; gap: 8px; }
.face {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 22px; line-height: 1.1; padding: 8px 0 6px; cursor: pointer;
  background: transparent; border: 1px solid var(--line); border-radius: 12px; color: inherit;
  opacity: .55; filter: grayscale(.7); transition: opacity .15s ease, filter .15s ease;
}
.face small { font: 600 10.5px var(--font-body); color: var(--ink-3); }
.face:hover { opacity: .85; filter: none; }
.face.on { opacity: 1; filter: none; background: var(--card-2); border-width: 2px; }

.move {
  display: flex; align-items: center; gap: 12px; margin-top: 12px;
  padding: 12px 14px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line);
}
.move .grow { flex: 1; min-width: 0; }
.move .kicker { margin-bottom: 3px; }
.move .what { font-size: 15px; font-weight: 650; }
.move .why { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.move .btn { flex: none; color: #0e1418; }
.move.made .made-list { display: flex; flex-wrap: wrap; gap: 6px; }

details.more { margin-top: 10px; }
details.more > summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink-3); list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: " ›"; }
details.more[open] > summary::after { content: " ⌄"; }
details.more > .flags { border-top: 0; padding-top: 0; margin-top: 8px; }

.path { list-style: none; margin: 0 0 6px; padding: 0; }
.path li { position: relative; }
.path li::before {
  content: ""; position: absolute; left: 8px; top: 24px; bottom: -6px; width: 2px; background: var(--line);
}
.path li:last-child::before { display: none; }
.path li.reached::before { background: var(--c); }
.path button {
  display: grid; grid-template-columns: 18px 1fr; column-gap: 12px; width: 100%;
  background: none; border: 0; color: inherit; font: inherit; text-align: left;
  padding: 6px 0 12px; cursor: pointer;
}
.path .node {
  grid-row: span 2; width: 18px; height: 18px; border-radius: 50%; margin-top: 2px;
  border: 2px solid var(--line); background: var(--card);
}
.path .reached .node { background: var(--c); border-color: var(--c); }
.path .is-next .node { border-color: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 22%, transparent); }
.path .ms-label { font-size: 14px; }
.path .reached .ms-label { color: var(--ink-2); }
.path .is-next .ms-label { font-weight: 650; }
.path .when { font-size: 11.5px; color: var(--ink-3); }

/* phones: summary rings shrink so every area fits on one row */
@media (max-width: 480px) {
  .hero { gap: 14px; }
  .sum-name { font-size: 10.5px; }
  .summary .ring-wrap { width: 46px !important; height: 46px !important; }
  .summary .ring-wrap svg { width: 46px; height: 46px; }
  .summary .pct { font-size: 11px; }
}

/* ---------- graphics ---------- */
.flower { flex: none; overflow: visible; }
.flower-pct { font: 650 11px var(--font-body); fill: var(--ink); }
.flower-key { margin: 10px 0 0; font-size: 11.5px; color: var(--ink-3); }
.trail, .feelchart { display: block; width: 100%; max-width: 480px; height: auto; overflow: visible; }
.trail-txt { font: 600 10px var(--font-body); fill: var(--ink-3); }
.trail-txt.you { fill: var(--ink); }
.vision { margin: 8px 0 0; font-family: var(--font-display); font-size: 15px; line-height: 1.5; color: var(--ink); }
@media (max-width: 480px) {
  .flower { width: 104px; height: 104px; }
}

.top-right { display: flex; align-items: center; gap: 8px; }
.install-btn { border-radius: 999px; padding: 7px 14px; }
</style>
<header class="topbar">
  <div class="brand" role="button" tabindex="0">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>Growth Rings</h1>
      <p id="dateLine"></p>
    </div>
  </div>
  <div class="top-right">
  <span id="installSlot"></span>
  <div class="coin-chip" role="button" tabindex="0" title="Coins available to invest">
    <span class="coin">◎</span><span id="coinBalance">0</span>
  </div>
  </div>
</header>

<nav class="tabs" id="nav" aria-label="Profiles"></nav>

<main id="app"></main>

<footer class="foot">
  <p id="storageLine">Everything stays on this device (browser storage). Export a backup from the bottom of Today.</p>
  <p class="fine">A personal tracker, not medical advice. Decisions about your ear, leg, shoulder, teeth or training belong with your clinicians.</p>
</footer>
<script>
/* Growth Rings — a small, local-first tracker for the areas you want to grow in.
   Data model, scoring and rendering all live here. No build step, no network. */
(function () {
  'use strict';

  var KEY = 'growth-rings-v1';
  var PALETTE = ['#31d0aa', '#f2c14e', '#7aa2f7', '#f0a04b', '#e08bb0', '#7fd4e8', '#a3d977', '#c39bf5'];

  /* ---------------------------------------------------------------- defaults */

  function seed() {
    return {
      version: 1,
      areas: [
        {
          id: 'ear', name: 'Ear — pulsatile tinnitus', emoji: '👂', color: '#7fd4e8',
          note: 'Unilateral (left). Earplugs have been the thing that helps most so far.',
          history: '',
          metrics: [
            { id: 'ear', label: 'Tinnitus loudness', low: 'quiet', high: 'loud', lowerIsBetter: true }
          ],
          flags: [
            { id: 'ear-loud', label: 'Loud place (park, concert, bar)', kind: 'exposure' },
            { id: 'ear-plugs', label: 'Ear protection with me', kind: 'protection' }

  function areaById(st, id) {
    return st.areas.filter(function (a) { return a.id === id; })[0];
  }
  function hasId(list, id) {
    return list.some(function (x) { return x.id === id; });
  }
  function addFlag(area, flag) { if (!hasId(area.flags, flag.id)) area.flags.push(flag); }
  function addInvestment(st, inv) { if (!hasId(st.investments, inv.id)) st.investments.push(inv); }
  function addMetric(area, m) { if (!hasId(area.metrics, m.id)) area.metrics.push(m); }
  function addAction(area, act, at) {
    if (hasId(area.actions, act.id)) return;
    area.actions.splice(typeof at === 'number' ? at : area.actions.length, 0, act);
  }

  function migrate(st) {
    if (!st.flags) st.flags = {};
    if (!st.applied) st.applied = [];
    if (!st.archive) st.archive = {};

    (st.areas || []).forEach(function (a) {
      // one rating per area became a list of them; the first keeps the area's
      // id as its key so every rating recorded so far still lines up
      if (!a.metrics) {
        a.metrics = (a.metric && a.metric.label)
          ? [{ id: a.id, label: a.metric.label, low: a.metric.low, high: a.metric.high, lowerIsBetter: !!a.metric.lowerIsBetter }]
          : [];
      }
      delete a.metric;
      if (!a.flags) a.flags = [];
      if (typeof a.history !== 'string') a.history = '';
      if (typeof a.goal !== 'string') a.goal = '';
      if (!a.milestones) a.milestones = [];
      if (typeof a.vision !== 'string') a.vision = '';
    });

    UPGRADES.forEach(function (u) {
      if (st.applied.indexOf(u.id) >= 0) return;
      try { u.apply(st); } catch (e) { /* an upgrade must never cost you your data */ }
      st.applied.push(u.id);
    });
    return st;
  }

  /* ------------------------------------------------------------------- state */

  var S = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return migrate(seed());
      var parsed = JSON.parse(raw);
      var base = seed();
      Object.keys(base).forEach(function (k) { if (!(k in parsed)) parsed[k] = base[k]; });
      return migrate(parsed);
    } catch (e) {
      return migrate(seed());
    }
  }

  function save() {
    S.updatedAt = Date.now();
    saveLocal();
    scheduleCloud();
  }

  function saveLocal() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* private mode: run in memory */ }
  }

  function anchorSave(name, text) {
    var type = /\.json$/.test(name) ? 'application/json' : 'text/plain';
    var blob = new Blob([text], { type: type });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

  function uid() { return Math.random().toString(36).slice(2, 9); }

  /* ------------------------------------------------------------------- dates */

  function keyOf(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function today() { return keyOf(new Date()); }
  function shift(days) { var d = new Date(); d.setDate(d.getDate() + days); return keyOf(d); }
  function lastDays(n, offset) {
    var out = [];
    for (var i = n - 1; i >= 0; i--) out.push(shift(-(i + (offset || 0))));
    return out;
  }
  function weekdayShort(k) {
    var p = k.split('-');
    return ['S', 'M', 'T', 'W', 'T', 'F', 'S'][new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
  }

  /* ----------------------------------------------------------------- lookups */

  function allActions() {
    return S.areas.reduce(function (acc, a) {
      return acc.concat(a.actions.map(function (x) { return { area: a, action: x }; }));
    }, []);
  }
  function coinsFor(actionId) {
    var hit = allActions().filter(function (p) { return p.action.id === actionId; })[0];
    if (hit) return hit.action.coins;
    return S.archive[actionId] ? S.archive[actionId].coins : 0;
  }
  function isDone(dayKey, actionId) { return !!(S.log[dayKey] && S.log[dayKey][actionId]); }
  function flagOn(dayKey, flagId) { return !!(S.flags[dayKey] && S.flags[dayKey][flagId]); }
  function toggleFlag(dayKey, flagId) {
    if (!S.flags[dayKey]) S.flags[dayKey] = {};
    if (S.flags[dayKey][flagId]) delete S.flags[dayKey][flagId];
    else S.flags[dayKey][flagId] = true;
    save();
    return flagOn(dayKey, flagId);
  }
  function hits(actionId, days) {
    return days.filter(function (d) { return isDone(d, actionId); }).length;
  }

  /* ----------------------------------------------------------------- scoring */

  // Rings are a rolling 7-day adherence score: for each habit, how much of its
  // weekly target you actually hit. Weighted by how much a habit is worth, so a
  // heavy habit moves the ring more than a light one.
  function areaScore(area, days) {
    var num = 0, den = 0;
    area.actions.forEach(function (act) {
      var target = Math.max(1, act.target || 1);
      var weight = target * Math.max(1, act.coins || 1);
      num += Math.min(hits(act.id, days), target) / target * weight;
      den += weight;
    });
    return den ? num / den : 0;
  }
  function week() { return lastDays(7); }
  function prevWeek() { return lastDays(7, 7); }

  function overallScore(days) {
    var live = S.areas.filter(function (a) { return a.actions.length; });
    if (!live.length) return 0;
    var s = 0;
    live.forEach(function (a) { s += areaScore(a, days); });
    return s / live.length;
  }

  // A single day's completion: coins earned that day against a fair daily share.
  function dayCompletion(dayKey) {
    var earned = 0, expected = 0;
    allActions().forEach(function (p) {
      var act = p.action;
      expected += (Math.max(1, act.coins || 1) * Math.max(1, act.target || 1)) / 7;
      if (isDone(dayKey, act.id)) earned += Math.max(1, act.coins || 1);
    });
    return expected ? Math.min(1.2, earned / expected) : 0;
  }

  // one workout that counts in two areas still earns its coins once
  function coinsOnDay(day) {
    var done = S.log[day] || {}, sum = 0;
    var echoed = {};
    allActions().forEach(function (p) {
      if (done[p.action.id]) (p.action.links || []).forEach(function (id) { echoed[id] = true; });
    });
    Object.keys(done).forEach(function (aid) { if (done[aid] && !echoed[aid]) sum += coinsFor(aid); });
    return sum;
  }
  function coinsEarned() {
    var total = 0;
    Object.keys(S.log).forEach(function (day) { total += coinsOnDay(day); });
    return total;
  }
  function coinsToday() { return coinsOnDay(today()); }
  function balance() { return Math.max(0, coinsEarned() - (S.spent || 0)); }

  function streak() {
    var n = 0, i = 0;
    if (!Object.keys(S.log[today()] || {}).length) i = 1; // today still open — don't break it
    for (; i < 400; i++) {
      var k = shift(-i);
      var any = Object.keys(S.log[k] || {}).some(function (a) { return S.log[k][a]; });
      if (any) n++; else break;
    }
    return n;
  }

  // average of a rating across every day that matches a test, with the sample
  // size, so a comparison can say how much it is standing on
  function ratingAvg(metricId, pred) {
    var vals = [];
    Object.keys(S.metrics).forEach(function (d) {
      var v = S.metrics[d][metricId];
      if (typeof v === 'number' && pred(d)) vals.push(v);
    });
    if (!vals.length) return null;
    var sum = vals.reduce(function (a, b) { return a + b; }, 0);
    return { avg: sum / vals.length, n: vals.length };
  }

  /* "the most pain it has been in a while" deserves an actual number: how far
     back you have to go to find a day that was this bad (or this good). Only
     speaks up once there is enough history behind it to mean something. */
  function standoutNote(metric, value) {
    var rated = 0, asBadAt = 0, asGoodAt = 0, oldest = 0;
    for (var i = 1; i <= 180; i++) {
      var v = (S.metrics[shift(-i)] || {})[metric.id];
      if (typeof v !== 'number') continue;
      rated++; oldest = i;
      if (!asBadAt && (metric.lowerIsBetter ? v >= value : v <= value)) asBadAt = i;
      if (!asGoodAt && (metric.lowerIsBetter ? v <= value : v >= value)) asGoodAt = i;
      if (asBadAt && asGoodAt) break;
    }
    if (rated < 6) return null;
    var worstSpan = asBadAt || oldest;
    var bestSpan = asGoodAt || oldest;
    if (worstSpan >= 7 && worstSpan >= bestSpan) return { text: 'worst in ' + worstSpan + ' days', cls: 'bad' };
    if (bestSpan >= 7) return { text: 'best in ' + bestSpan + ' days', cls: 'good' };
    return null;
  }

  /* Days you tagged against days you didn't — the question behind the tags is
     "does this kind of day cost me?". Uses all history, not just a fortnight,
     and a tag you have never used has nothing to say yet. */
  function computePatterns() {
    var out = [];
    S.areas.forEach(function (area) {
      var exposures = area.flags.filter(function (f) { return f.kind === 'exposure'; });
      var guards = area.flags.filter(function (f) { return f.kind === 'protection'; });

      areaMetrics(area).forEach(function (m) {
        if (!m.label) return;
        exposures.forEach(function (f) {
          out.push({
            area: area, metric: m, name: f.label,
            on: ratingAvg(m.id, function (d) { return flagOn(d, f.id); }),
            off: ratingAvg(m.id, function (d) { return !flagOn(d, f.id); }),
            onWord: 'on those days', offWord: 'otherwise'
          });
          // and, on those days specifically, did the protection help?
          guards.forEach(function (g) {
            out.push({
              area: area, metric: m, name: g.label + ' · ' + f.label.toLowerCase(),
              on: ratingAvg(m.id, function (d) { return flagOn(d, f.id) && flagOn(d, g.id); }),
              off: ratingAvg(m.id, function (d) { return flagOn(d, f.id) && !flagOn(d, g.id); }),
              onWord: 'with', offWord: 'without'
            });
          });
        });
      });
    });
    return out.filter(function (p) { return p.on && p.on.n > 0; });
  }

  function patternLine(p) {
    if (!(p.on && p.off && p.on.n >= 2 && p.off.n >= 2)) {
      return { enough: false, desc: p.metric.label.toLowerCase() + ' · needs a few more rated days (' +
        (p.on ? p.on.n : 0) + ' / ' + (p.off ? p.off.n : 0) + ')', label: '—', cls: 'flat' };
    }
    var diff = p.on.avg - p.off.avg;
    var better = p.metric.lowerIsBetter ? diff < 0 : diff > 0;
    return {
      enough: true,
      desc: p.metric.label.toLowerCase() + ' ' + p.on.avg.toFixed(1) + ' ' + p.onWord +
        ' (' + p.on.n + ' days) vs ' + p.off.avg.toFixed(1) + ' ' + p.offWord + ' (' + p.off.n + ')',
      label: (diff > 0 ? '+' : '') + diff.toFixed(1),
      cls: Math.abs(diff) < 0.4 ? 'flat' : (better ? 'up' : 'down')
    };
  }

  function metricAvg(areaId, days) {
    var vals = days.map(function (d) { return S.metrics[d] && S.metrics[d][areaId]; })
      .filter(function (v) { return typeof v === 'number'; });
    if (!vals.length) return null;
    return vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
  }

  /* --------------------------------------------------------------- rendering */

  function el(html) {
    var d = document.createElement('div');
    d.innerHTML = html.trim();
    return d.firstElementChild;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function shortName(name) {
    return String(name).split(' — ')[0].split(' - ')[0].trim() || name;
  }

  function pct(x) { return Math.round(x * 100); }

  function ring(value, size, stroke, color) {
    var r = (size - stroke) / 2;
    var c = 2 * Math.PI * r;
    var v = Math.max(0, Math.min(1, value));
    return '<div class="ring-wrap" style="width:' + size + 'px;height:' + size + 'px">' +
      '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<circle class="ring-track" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke-width="' + stroke + '"/>' +
      '<circle class="ring-bar" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '"' +
      ' stroke-width="' + stroke + '" stroke-linecap="' + (v < 0.05 ? 'butt' : 'round') + '" stroke-dasharray="' + c.toFixed(1) + '"' +
      ' stroke-dashoffset="' + (c * (1 - v)).toFixed(1) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' +
      '</svg>' +
      '<div class="ring-label"><div class="pct' + (size < 90 ? ' sm' : '') + '">' + pct(value) + '<span style="font-size:.6em">%</span></div></div>' +
      '</div>';
  }

  function sparkline(values, color, lowerIsBetter) {
    var w = 120, h = 26;
    var pts = values.map(function (v, i) {
      var x = values.length > 1 ? (i / (values.length - 1)) * w : w / 2;
      var y = h - (v / 10) * (h - 4) - 2;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
      '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="' + (lowerIsBetter ? .85 : .85) + '"/></svg>';
  }

  /* ---------------------------------------------------------------- navigation */

  /* Views are addressed by name: 'today', 'coins', or 'area:<id>'. Profiles are
     the centre of the app — everything about one part of you in one place. */

  function go(view) {
    S.view = view;
    save();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function currentArea() {
    if (String(S.view).indexOf('area:') !== 0) return null;
    return S.areas.filter(function (a) { return a.id === S.view.slice(5); })[0] || null;
  }

  function renderNav() {
    var nav = document.getElementById('nav');
    nav.innerHTML = '';
    var tabs = [{ view: 'today', label: 'Today' }];
    S.areas.forEach(function (a) {
      tabs.push({ view: 'area:' + a.id, label: a.emoji + ' ' + shortName(a.name) });
    });
    tabs.push({ view: 'coins', label: '◎ Coins' });

    tabs.forEach(function (t) {
      var b = el('<button class="tab' + (S.view === t.view ? ' is-active' : '') + '" type="button">' + esc(t.label) + '</button>');
      b.addEventListener('click', function () { go(t.view); });
      nav.appendChild(b);
    });
  }

  /* ------------------------------------------------------------ shared pieces */

  /* --------------------------------------------------------------- journeys */

  /* Each area is a path toward something, not a checklist. The day asks two
     things per area: how did it feel, and did you make a move toward it. */

  var FACES = [
    { v: 1, e: '😣', t: 'rough' },
    { v: 4, e: '😐', t: 'meh' },
    { v: 7, e: '🙂', t: 'good' },
    { v: 10, e: '😌', t: 'great' }
  ];

  // the faces are stored as a 0–10 rating like any other, so findings, trends
  // and the appointment summary pick them up without a second code path
  function feelMetric(area) {
    return { id: 'feel:' + area.id, label: 'How it felt overall', low: 'rough', high: 'great', lowerIsBetter: false };
  }
  function areaMetrics(area) {
    return [feelMetric(area)].concat(area.metrics.filter(function (m) { return m.label; }));
  }

  function nextMilestone(area) {
    return area.milestones.filter(function (m) { return !m.done; })[0] || null;
  }
  function reachedCount(area) {
    return area.milestones.filter(function (m) { return m.done; }).length;
  }

  // the move suggested for today: whichever is furthest behind its weekly aim
  var moveOffset = {};
  function moveCandidates(area) {
    var t = today(), days = week();
    return area.actions.filter(function (a) { return !isDone(t, a.id); })
      .map(function (a) {
        var target = Math.max(1, a.target || 1);
        return { act: a, gap: Math.max(0, target - hits(a.id, days)) / target };
      })
      .sort(function (x, y) { return (y.gap - x.gap) || ((y.act.coins || 0) - (x.act.coins || 0)); })
      .map(function (x) { return x.act; });
  }
  function movesMadeToday(area) {
    var t = today();
    return area.actions.filter(function (a) { return isDone(t, a.id); });
  }

  function milestoneDots(area) {
    if (!area.milestones.length) return '';
    var next = nextMilestone(area);
    return '<div class="pathline"><span class="dots">' + area.milestones.map(function (m) {
      return '<i' + (m.done ? ' style="background:' + esc(area.color) + '"' : '') + '></i>';
    }).join('') + '</span><span>' + reachedCount(area) + ' of ' + area.milestones.length +
      (next ? ' · next: ' + esc(next.label) : ' · every milestone reached') + '</span></div>';
  }

  function pathBlock(area) {
    var wrap = el('<div></div>');
    var list = el('<ol class="path"></ol>');
    var next = nextMilestone(area);
    area.milestones.forEach(function (m) {
      var li = el('<li class="' + (m.done ? 'reached' : '') + (m === next ? ' is-next' : '') + '" style="--c:' + esc(area.color) + '">' +
        '<button type="button"><span class="node"></span>' +
        '<span class="ms-label">' + esc(m.label) + '</span>' +
        '<span class="when">' + (m.done ? 'reached' + (m.doneAt ? ' ' + esc(m.doneAt) : '') : (m === next ? 'next on the path · tap when reached' : '')) + '</span>' +
        '</button></li>');
      li.querySelector('button').addEventListener('click', function () {
        m.done = !m.done;
        if (m.done) m.doneAt = today(); else delete m.doneAt;
        save(); render();
      });
      list.appendChild(li);
    });
    if (area.milestones.length) wrap.appendChild(list);
    else wrap.appendChild(el('<p class="empty">No milestones yet. Add the first step below.</p>'));

    var add = el('<div class="row" style="margin-top:6px"><input type="text" class="grow" placeholder="add a milestone…"><button class="btn">Add</button></div>');
    add.querySelector('button').addEventListener('click', function () {
      var v = add.querySelector('input').value.trim();
      if (!v) return;
      area.milestones.push({ id: uid(), label: v, done: false });
      save(); render();
    });
    wrap.appendChild(add);
    return wrap;
  }

  function feelRow(area) {
    var t = today(), id = feelMetric(area).id;
    var wrap = el('<div class="feel"><div class="kicker">' + esc(area.feelPrompt || 'How is it today?') + '</div><div class="faces"></div></div>');
    var row = wrap.querySelector('.faces');
    FACES.forEach(function (f) {
      var on = (S.metrics[t] || {})[id] === f.v;
      var b = el('<button type="button" class="face' + (on ? ' on' : '') + '"' + (on ? ' style="border-color:' + esc(area.color) + '"' : '') +
        ' aria-label="' + f.t + '">' + f.e + '<small>' + f.t + '</small></button>');
      b.addEventListener('click', function () {
        if (!S.metrics[t]) S.metrics[t] = {};
        if (S.metrics[t][id] === f.v) delete S.metrics[t][id];
        else S.metrics[t][id] = f.v;
        save(); render();
      });
      row.appendChild(b);
    });
    var cur = (S.metrics[t] || {})[id];
    var n = typeof cur === 'number' ? standoutNote(feelMetric(area), cur) : null;
    if (n) wrap.appendChild(el('<div class="metric-note ' + n.cls + '">' + esc(n.text) + '</div>'));
    return wrap;
  }

  function moveBlock(area) {
    var t = today();
    var wrap = el('<div></div>');
    if (!area.actions.length) return wrap;

    var made = movesMadeToday(area);
    var cands = moveCandidates(area);

    if (made.length) {
      var doneBox = el('<div class="move made" style="border-color:' + esc(area.color) + '">' +
        '<div class="grow"><div class="kicker">Moved forward today</div><div class="made-list"></div></div></div>');
      made.forEach(function (a) {
        var chip = el('<button type="button" class="flag on" style="border-color:' + esc(area.color) + '" title="tap to undo">' + esc(a.label) + '</button>');
        chip.addEventListener('click', function () { toggle(t, a.id); });
        doneBox.querySelector('.made-list').appendChild(chip);
      });
      wrap.appendChild(doneBox);
    }

    if (cands.length) {
      var i = (moveOffset[area.id] || 0) % cands.length;
      var pick = cands[i];
      var box = el('<div class="move">' +
        '<div class="grow"><div class="kicker">' + (made.length ? 'Another move, if you have it in you' : 'Today’s move') + '</div>' +
        '<div class="what">' + esc(pick.label) + '</div>' +
        '<div class="why">' + hits(pick.id, week()) + ' of ' + pick.target + ' this week · ◎' + pick.coins + '</div></div>' +
        '<button type="button" class="btn primary mv-do" style="background:' + esc(area.color) + ';border-color:' + esc(area.color) + '">Did it</button></div>');
      box.querySelector('.mv-do').addEventListener('click', function () { moveOffset[area.id] = 0; toggle(t, pick.id); });
      wrap.appendChild(box);

      if (cands.length > 1) {
        var more = el('<details class="more"><summary>Other moves</summary><div class="flags"></div></details>');
        cands.forEach(function (a, j) {
          if (j === i) return;
          var chip = el('<button type="button" class="flag">' + esc(a.label) + '</button>');
          chip.addEventListener('click', function () { toggle(t, a.id); });
          more.querySelector('.flags').appendChild(chip);
        });
        wrap.appendChild(more);
      }
    }
    return wrap;
  }

  /* -------------------------------------------------------------- graphics */

  function progressOf(area) {
    return area.milestones.length ? reachedCount(area) / area.milestones.length : 0;
  }

  /* One petal per area: the outline is the destination, the fill is how far
     along its path you are. The emoji at the tip names it, so colour is never
     the only thing telling the petals apart. */
  function healthFlower() {
    var size = 132, c = size / 2, R = 44, n = Math.max(1, S.areas.length);
    var reached = 0, total = 0;
    S.areas.forEach(function (a) { reached += reachedCount(a); total += a.milestones.length; });
    var out = '<svg class="flower" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" role="img"' +
      ' aria-label="Progress toward health: ' + reached + ' of ' + total + ' milestones">';
    S.areas.forEach(function (a, i) {
      var deg = i * 360 / n, p = progressOf(a);
      var L = R * (0.18 + 0.82 * p), w = Math.min(13, 55 / n);
      var tr = 'translate(' + c + ' ' + c + ') rotate(' + deg + ')';
      out += '<g transform="' + tr + '"><title>' + esc(shortName(a.name)) + ': ' + reachedCount(a) + ' of ' + a.milestones.length + ' milestones</title>' +
        '<ellipse cx="0" cy="' + (-R / 2) + '" rx="' + w + '" ry="' + (R / 2) + '" fill="' + esc(a.color) + '" fill-opacity=".1" stroke="' + esc(a.color) + '" stroke-opacity=".45" stroke-width="1"/>' +
        '<ellipse cx="0" cy="' + (-L / 2) + '" rx="' + (w * (0.55 + 0.45 * p)) + '" ry="' + (L / 2) + '" fill="' + esc(a.color) + '"/></g>';
      var rad = (deg - 90) * Math.PI / 180, er = R + 10;
      out += '<text x="' + (c + er * Math.cos(rad)).toFixed(1) + '" y="' + (c + er * Math.sin(rad) + 4).toFixed(1) + '" font-size="12" text-anchor="middle">' + esc(a.emoji) + '</text>';
    });
    out += '<circle cx="' + c + '" cy="' + c + '" r="15" fill="var(--card)" stroke="var(--line)"/>' +
      '<text x="' + c + '" y="' + (c + 4) + '" text-anchor="middle" class="flower-pct">' + (total ? Math.round(reached / total * 100) : 0) + '%</text></svg>';
    return out;
  }

  // a cubic curve sampled by length, so milestones sit evenly along the trail
  function trailPoints(n) {
    var P = [[14, 74], [120, 92], [170, 14], [306, 26]], pts = [], len = [0];
    for (var i = 0; i <= 200; i++) {
      var t = i / 200, u = 1 - t;
      pts.push([
        u * u * u * P[0][0] + 3 * u * u * t * P[1][0] + 3 * u * t * t * P[2][0] + t * t * t * P[3][0],
        u * u * u * P[0][1] + 3 * u * u * t * P[1][1] + 3 * u * t * t * P[2][1] + t * t * t * P[3][1]
      ]);
      if (i) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    }
    var at = function (f) {
      var target = f * len[200];
      for (var j = 1; j <= 200; j++) if (len[j] >= target) return pts[j];
      return pts[200];
    };
    return { d: 'M' + P[0] + ' C' + P[1] + ' ' + P[2] + ' ' + P[3], at: at, n: n };
  }

  function trailGraphic(area) {
    var n = area.milestones.length, tp = trailPoints(n), k = reachedCount(area);
    var you = n ? k / (n + 1) : 0;
    var out = '<svg class="trail" viewBox="0 0 320 112" role="img" aria-label="' + k + ' of ' + n + ' milestones reached on the way to healthy">' +
      '<path d="' + tp.d + '" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 8"/>' +
      '<path d="' + tp.d + '" fill="none" stroke="' + esc(area.color) + '" stroke-width="4" stroke-linecap="round" pathLength="100"' +
      ' stroke-dasharray="' + (you * 100).toFixed(1) + ' 200"/>';
    area.milestones.forEach(function (m, i) {
      var p = tp.at((i + 1) / (n + 1));
      out += '<g><title>' + esc(m.label) + (m.done ? ' — reached' : '') + '</title>' +
        '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="10" fill="transparent"/>' +
        (m.done
          ? '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="6" stroke="var(--card)" stroke-width="2" fill="' + esc(area.color) + '"/>'
          : '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="5" stroke="var(--ink-3)" stroke-width="2" fill="var(--card)"/>') + '</g>';
    });
    var y = tp.at(you), end = tp.at(1);
    out += '<text x="' + (end[0] - 4) + '" y="' + (end[1] - 8) + '" font-size="18" text-anchor="middle">🏁</text>' +
      '<text x="306" y="52" text-anchor="end" class="trail-txt">healthy</text>' +
      '<text x="14" y="98" class="trail-txt">start</text>' +
      '<circle cx="' + y[0].toFixed(1) + '" cy="' + y[1].toFixed(1) + '" r="8" fill="' + esc(area.color) + '" stroke="var(--card)" stroke-width="2"/>' +
      '<text x="' + y[0].toFixed(1) + '" y="' + (y[1] - 13).toFixed(1) + '" text-anchor="middle" class="trail-txt you">you</text></svg>';
    return out;
  }

  /* weekly buckets, oldest first: week 0 is the last seven days */
  function weeksBack(n) {
    var out = [];
    for (var i = n - 1; i >= 0; i--) out.push(lastDays(7, 7 * i));
    return out;
  }
  function weekLabel(days) { return i18nShort(days[0]); }
  function i18nShort(k) {
    var p = k.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function movesChart(weeks) {
    var vals = weeks.map(function (w) {
      return w.reduce(function (n, d) { return n + Object.keys(S.log[d] || {}).filter(function (k) { return S.log[d][k]; }).length; }, 0);
    });
    var max = Math.max(4, Math.max.apply(null, vals));
    var W = 320, H = 116, x0 = 20, x1 = 316, top = 14, base = 92, slot = (x1 - x0) / vals.length, bw = Math.min(24, slot - 8);
    var y = function (v) { return base - v / max * (base - top); };
    var tick = Math.ceil(max / 2);
    var out = '<svg class="feelchart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Moves per week, last ' + vals.length + ' weeks">';
    [0, tick, tick * 2].forEach(function (t) {
      if (t > max) return;
      out += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--line)"/>' +
        '<text x="0" y="' + (y(t) + 3) + '" class="trail-txt">' + t + '</text>';
    });
    vals.forEach(function (v, i) {
      var cx = x0 + slot * i + slot / 2, xl = cx - bw / 2, yt = y(v), r = Math.min(4, bw / 2);
      out += '<g><title>Week of ' + weekLabel(weeks[i]) + ': ' + v + ' move' + (v === 1 ? '' : 's') + '</title>' +
        '<rect x="' + (cx - slot / 2) + '" y="' + top + '" width="' + slot + '" height="' + (base - top) + '" fill="transparent"/>';
      if (v > 0) out += '<path d="M' + xl + ' ' + base + ' V' + (yt + r) + ' Q' + xl + ' ' + yt + ' ' + (xl + r) + ' ' + yt +
        ' H' + (xl + bw - r) + ' Q' + (xl + bw) + ' ' + yt + ' ' + (xl + bw) + ' ' + (yt + r) + ' V' + base + ' Z" fill="var(--accent)"/>';
      out += '</g>';
      if (i === vals.length - 1 || i === 0) {
        out += '<text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle" class="trail-txt">' + (i === vals.length - 1 ? 'this week' : weekLabel(weeks[i])) + '</text>';
      }
    });
    var last = vals[vals.length - 1];
    if (last > 0) {
      var lx = x0 + slot * (vals.length - 1) + slot / 2;
      out += '<text x="' + lx + '" y="' + (y(last) - 5) + '" text-anchor="middle" class="trail-txt you">' + last + '</text>';
    }
    return out + '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + base + '" y2="' + base + '" stroke="var(--line)"/></svg>';
  }

  function feelTrendChart(weeks) {
    var vals = weeks.map(function (w) {
      var all = [];
      w.forEach(function (d) {
        S.areas.forEach(function (a) {
          var v = (S.metrics[d] || {})[feelMetric(a).id];
          if (typeof v === 'number') all.push(v);
        });
      });
      return all.length ? all.reduce(function (x, y) { return x + y; }, 0) / all.length : null;
    });
    var W = 320, H = 116, x0 = 24, x1 = 310, top = 10, base = 92, step = (x1 - x0) / Math.max(1, vals.length - 1);
    var y = function (v) { return base - (v / 10) * (base - top); };
    var out = '<svg class="feelchart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Average feel across every area, by week">';
    FACES.forEach(function (f) {
      out += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y(f.v) + '" y2="' + y(f.v) + '" stroke="var(--line)"/>' +
        '<text x="0" y="' + (y(f.v) + 4) + '" font-size="11">' + f.e + '</text>';
    });
    var seg = '', any = false;
    vals.forEach(function (v, i) {
      if (v == null) return;
      seg += (seg ? ' L' : 'M') + (x0 + step * i).toFixed(1) + ' ' + y(v).toFixed(1);
    });
    if (seg) out += '<path d="' + seg + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    vals.forEach(function (v, i) {
      var cx = x0 + step * i;
      out += '<g><title>Week of ' + weekLabel(weeks[i]) + ': ' + (v == null ? 'no check-ins' : faceFor(v).e + ' ' + v.toFixed(1) + ' of 10') + '</title>' +
        '<rect x="' + (cx - step / 2) + '" y="' + top + '" width="' + step + '" height="' + (base - top) + '" fill="transparent"/>';
      if (v != null) { any = true; out += '<circle cx="' + cx + '" cy="' + y(v) + '" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>'; }
      out += '</g>';
    });
    out += '<text x="' + x0 + '" y="' + (H - 6) + '" class="trail-txt">' + weekLabel(weeks[0]) + '</text>' +
      '<text x="' + x1 + '" y="' + (H - 6) + '" text-anchor="end" class="trail-txt">this week</text></svg>';
    if (!any) out = '<div>' + out + '<p class="muted" style="margin:6px 0 0">Tap a face for each area and this line starts to draw.</p></div>';
    return out;
  }

  function progressCard() {
    var weeks = weeksBack(8);
    var card = el('<div class="card"><div class="card-head"><div><h2>Your progress</h2>' +
      '<p class="sub">The last 8 weeks. Hover or tap a week for its number.</p></div></div>' +
      '<div class="kicker">Moves made, per week</div></div>');
    card.appendChild(el(movesChart(weeks)));
    card.appendChild(el('<div class="kicker" style="margin-top:16px">How you’ve felt, across every area</div>'));
    card.appendChild(el(feelTrendChart(weeks)));

    var done = [];
    S.areas.forEach(function (a) {
      a.milestones.forEach(function (m) { if (m.done) done.push({ a: a, m: m }); });
    });
    done.sort(function (x, y) { return String(y.m.doneAt || '').localeCompare(String(x.m.doneAt || '')); });
    card.appendChild(el('<div class="kicker" style="margin-top:16px">Milestones reached</div>'));
    if (done.length) {
      done.slice(0, 5).forEach(function (x) {
        card.appendChild(el('<div class="finding"><span class="tone" style="background:' + esc(x.a.color) + '"></span>' +
          '<span>' + esc(x.a.emoji) + ' ' + esc(x.m.label) + (x.m.doneAt ? ' <span class="muted">· ' + esc(i18nShort(x.m.doneAt)) + '</span>' : '') + '</span></div>'));
      });
    } else {
      card.appendChild(el('<p class="muted" style="margin:0">None yet. Open an area and tap a milestone when you reach it.</p>'));
    }
    return card;
  }

  function faceFor(v) {
    var best = FACES[0];
    FACES.forEach(function (f) { if (Math.abs(f.v - v) < Math.abs(best.v - v)) best = f; });
    return best;
  }

  function feelChart(area) {
    var id = feelMetric(area).id, days = lastDays(30);
    var W = 320, H = 118, x0 = 24, x1 = 316, top = 8, base = 96;
    var slot = (x1 - x0) / days.length, bw = Math.min(8, slot - 2);
    var y = function (v) { return base - (v / 10) * (base - top); };
    var out = '<svg class="feelchart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="How ' + esc(shortName(area.name)) + ' has felt, last 30 days">';
    FACES.forEach(function (f) {
      out += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y(f.v) + '" y2="' + y(f.v) + '" stroke="var(--line)" stroke-width="1"/>' +
        '<text x="0" y="' + (y(f.v) + 4) + '" font-size="11">' + f.e + '</text>';
    });
    var rated = 0;
    days.forEach(function (d, i) {
      var v = (S.metrics[d] || {})[id], cx = x0 + slot * i + slot / 2;
      var tip = d + ': ' + (typeof v === 'number' ? faceFor(v).e + ' ' + faceFor(v).t : 'not checked in');
      out += '<g><title>' + tip + '</title><rect x="' + (cx - slot / 2) + '" y="' + top + '" width="' + slot + '" height="' + (base - top) + '" fill="transparent"/>';
      if (typeof v === 'number') {
        rated++;
        var yt = y(v), r = Math.min(3, bw / 2), xl = cx - bw / 2;
        out += '<path d="M' + xl + ' ' + base + ' V' + (yt + r) + ' Q' + xl + ' ' + yt + ' ' + (xl + r) + ' ' + yt +
          ' H' + (xl + bw - r) + ' Q' + (xl + bw) + ' ' + yt + ' ' + (xl + bw) + ' ' + (yt + r) + ' V' + base + ' Z" fill="' + esc(area.color) + '"/>';
      } else {
        out += '<circle cx="' + cx + '" cy="' + base + '" r="1.5" fill="var(--ink-3)" opacity=".5"/>';
      }
      out += '</g>';
    });
    out += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + base + '" y2="' + base + '" stroke="var(--line)"/>' +
      '<text x="' + x0 + '" y="' + (H - 4) + '" class="trail-txt">' + days[0].slice(5) + '</text>' +
      '<text x="' + x1 + '" y="' + (H - 4) + '" text-anchor="end" class="trail-txt">today</text></svg>';
    if (!rated) out = '<div>' + out + '<p class="muted" style="margin:6px 0 0">Tap a face on Today and the bars start filling in.</p></div>';
    return out;
  }

  /* The daily check-in for one area: how it felt, the move you made, what the
     day was like. Used on Today and again on the area's own profile. */
  function logBlock(area, opts) {
    var t = today();
    var wrap = el('<div></div>');
    wrap.appendChild(feelRow(area));
    wrap.appendChild(moveBlock(area));

    var extra = wrap;
    if (opts.compact && (area.flags.length || area.metrics.length)) {
      extra = el('<details class="more"><summary>Tag the day · rate in detail</summary></details>');
      wrap.appendChild(extra);
    }

    if (area.flags.length) {
      if (!opts.compact) extra.appendChild(el('<div class="kicker" style="margin-top:14px">What was today like?</div>'));
      var chips = el('<div class="flags"></div>');
      area.flags.forEach(function (flag) {
        var on = flagOn(t, flag.id);
        var chip = el('<button class="flag' + (on ? ' on' : '') + '" type="button">' + esc(flag.label) + '</button>');
        if (on) chip.style.borderColor = area.color;
        chip.addEventListener('click', function () {
          var nowOn = toggleFlag(t, flag.id);
          chip.classList.toggle('on', nowOn);
          chip.style.borderColor = nowOn ? area.color : '';
        });
        chips.appendChild(chip);
      });
      extra.appendChild(chips);
    }

    area.metrics.forEach(function (metric) {
      if (!metric.label) return;
      var cur = (S.metrics[t] || {})[metric.id];
      var m = el(
        '<div class="metric">' +
        '<div class="metric-head"><span>' + esc(metric.label) + ' today</span>' +
        '<b>' + (typeof cur === 'number' ? cur + '/10' : 'not set') + '</b></div>' +
        '<input type="range" min="0" max="10" step="1" value="' + (typeof cur === 'number' ? cur : 5) + '">' +
        '<div class="metric-head" style="margin:4px 0 0"><span>' + esc(metric.low || '0') + '</span><span>' + esc(metric.high || '10') + '</span></div>' +
        '</div>'
      );
      var noteEl = el('<div class="metric-note"></div>');
      m.appendChild(noteEl);
      var refreshNote = function () {
        var val = (S.metrics[t] || {})[metric.id];
        var n = (typeof val === 'number') ? standoutNote(metric, val) : null;
        noteEl.textContent = n ? n.text : '';
        noteEl.className = 'metric-note' + (n ? ' ' + n.cls : '');
      };
      refreshNote();
      m.querySelector('input').addEventListener('input', function (e) {
        if (!S.metrics[t]) S.metrics[t] = {};
        S.metrics[t][metric.id] = +e.target.value;
        m.querySelector('.metric-head b').textContent = e.target.value + '/10';
        refreshNote();
        save();
      });
      extra.appendChild(m);
    });

    return wrap;
  }

  function toggle(dayKey, actionId) {
    if (!S.log[dayKey]) S.log[dayKey] = {};
    var on = !S.log[dayKey][actionId];
    linkedIds(actionId).concat([actionId]).forEach(function (id) {
      if (on) S.log[dayKey][id] = true; else delete S.log[dayKey][id];
    });
    save();
    render();
  }

  /* A move can count in more than one area — a lower-body session is strength
     work and leg rehab at once. Links run both ways, one step deep. */
  function linkedIds(actionId) {
    var out = [];
    allActions().forEach(function (p) {
      var links = p.action.links || [];
      if (p.action.id === actionId) out = out.concat(links);
      else if (links.indexOf(actionId) >= 0) out.push(p.action.id);
    });
    return out.filter(function (id, i) { return id !== actionId && out.indexOf(id) === i; });
  }

  function dayNoteCard() {
    var t = today();
    var note = el(
      '<div class="card"><div class="card-head"><div><h2>Note for today</h2>' +
      '<p class="sub">Anything you noticed — triggers, flare-ups, what helped.</p></div></div>' +
      '<textarea placeholder="e.g. ear was louder after the loud restaurant; knee felt solid on the stairs"></textarea></div>'
    );
    var ta = note.querySelector('textarea');
    ta.value = S.notes[t] || '';
    ta.addEventListener('change', function () { S.notes[t] = ta.value; save(); });
    return note;
  }

  /* ------------------------------------------------------------- view: today */

  function renderToday(root) {
    var days = week(), overall = overallScore(days);

    var movesWeek = 0, reached = 0, total = 0;
    days.forEach(function (d) { movesWeek += Object.keys(S.log[d] || {}).filter(function (k) { return S.log[d][k]; }).length; });
    S.areas.forEach(function (a) { reached += reachedCount(a); total += a.milestones.length; });

    var hero = el(
      '<div class="card"><div class="hero">' +
      healthFlower() +
      '<div class="hero-stats">' +
      '<div class="big">Moving toward health</div>' +

      '<div class="pillrow">' +
      '<span class="pill gold">◎ ' + coinsToday() + ' earned today</span>' +

      '</div></div></div>' +
      '<p class="flower-key">Each petal is an area. It grows as you reach the milestones on its path; the outline is what healthy looks like.</p></div>'
    );

    if (S.areas.length) {
      hero.appendChild(el('<div class="kicker" style="margin-top:14px">This week’s momentum</div>'));
      var summary = el('<div class="summary" style="margin-top:6px;border-top:0;padding-top:0"></div>');
      S.areas.forEach(function (area) {

          ring(areaScore(area, days), 52, 6, esc(area.color)) +

      });

      var head = el('<button class="area-link" type="button">' +
        '<span class="emoji">' + esc(area.emoji) + '</span>' +
        '<span class="grow"><span class="name">' + esc(area.name) + '</span>' +
        (area.goal ? '<span class="desc">' + esc(area.goal) + '</span>' : '') + '</span>' +
        '<span class="muted">path ›</span></button>');
      head.addEventListener('click', function () { go('area:' + area.id); });
      card.appendChild(head);
      if (area.milestones.length) card.appendChild(el(milestoneDots(area)));
      card.appendChild(logBlock(area, { compact: true }));

    });

    root.appendChild(dayNoteCard());

  /* ----------------------------------------------------------- view: profile */

  /* What the data is actually saying about this area, in sentences. */
  function findings(area) {
    var out = [], days = week(), prev = prevWeek(), t = today();

    areaMetrics(area).forEach(function (m) {
      if (!m.label) return;
      var now = (S.metrics[t] || {})[m.id];
      if (typeof now === 'number') {
        var sn = standoutNote(m, now);
        if (sn) out.push({ text: m.label + ' is ' + now + '/10 today — ' + sn.text + '.', tone: sn.cls });
      }
      var a = metricAvg(m.id, days), b = metricAvg(m.id, prev);
      if (a != null && b != null && Math.abs(a - b) >= 0.3) {
        var better = m.lowerIsBetter ? a < b : a > b;
        out.push({
          text: m.label + ' averaged ' + a.toFixed(1) + ' this week against ' + b.toFixed(1) + ' last — ' +
            (better ? 'moving the right way' : 'moving the wrong way') + '.',
          tone: better ? 'good' : 'bad'
        });
      }
    });

    computePatterns().filter(function (p) { return p.area.id === area.id; }).forEach(function (p) {
      var r = patternLine(p);
      if (!r.enough) return;
      var diff = p.on.avg - p.off.avg;
      if (Math.abs(diff) < 0.4) return;
      var better = p.metric.lowerIsBetter ? diff < 0 : diff > 0;
      out.push({
        text: p.name + ': ' + p.metric.label.toLowerCase() + ' runs ' + p.on.avg.toFixed(1) + ' ' + p.onWord +
          ' against ' + p.off.avg.toFixed(1) + ' ' + p.offWord + ' (' + p.on.n + ' days vs ' + p.off.n + ').',
        tone: better ? 'good' : 'bad'
      });
    });

    var nm = nextMilestone(area);
    if (nm) out.push({ text: 'Next on the path: ' + nm.label + '.', tone: 'flat' });

    var now = areaScore(area, days), before = areaScore(area, prev);
    if (area.actions.length) {
      var d = pct(now) - pct(before);
      out.push({
        text: 'You are at ' + pct(now) + '% of this profile’s weekly moves' +
          (Math.abs(d) < 3 ? ', about the same as last week.' : (d > 0 ? ', up ' + d + ' points on last week.' : ', down ' + Math.abs(d) + ' points on last week.')),
        tone: Math.abs(d) < 3 ? 'flat' : (d > 0 ? 'good' : 'bad')
      });
    }

    return out;
  }

  function renderProfile(root, area) {
    var days = week();

    var back = el('<button class="backlink" type="button">‹ All profiles</button>');
    back.addEventListener('click', function () { go('today'); });
    root.appendChild(back);

    root.appendChild(el(
      '<div class="card area prof-head" style="border-left-color:' + esc(area.color) + '">' +
      '<div class="area-top">' + ring(areaScore(area, days), 72, 9, esc(area.color)) +
      '<div class="grow"><h2><span class="emoji">' + esc(area.emoji) + '</span> ' + esc(area.name) + '</h2>' +
      (area.goal ? '<p class="goal">' + esc(area.goal) + '</p>' : '') +
      (area.note ? '<p class="sub">' + esc(area.note) + '</p>' : '') +
      '<p class="sub">' + pct(areaScore(area, days)) + '% momentum this week · ' + reachedCount(area) + ' of ' +
      area.milestones.length + ' milestones reached</p>' +
      '</div></div></div>'
    ));

    /* --- where it is heading --- */
    var vc = el('<div class="card"><div class="card-head"><div><h2>What healthy looks like</h2>' +
      '<p class="sub">The destination, and where you are on the way.</p></div></div></div>');
    vc.appendChild(el(trailGraphic(area)));
    vc.appendChild(el(area.vision
      ? '<p class="vision">' + esc(area.vision).replace(/\n/g, '<br>') + '</p>'
      : '<p class="muted">Describe it in Set up this profile — what a good day looks like once this is healthy.</p>'));
    root.appendChild(vc);

    /* --- how it has felt --- */
    var fcard = el('<div class="card"><div class="card-head"><div><h2>How it’s felt</h2>' +
      '<p class="sub">Your daily faces, last 30 days. Hover or tap a day for its value.</p></div></div></div>');
    fcard.appendChild(el(feelChart(area)));
    root.appendChild(fcard);

    /* --- the path --- */
    var pc = el('<div class="card"><div class="card-head"><div><h2>The path</h2>' +

      '. Tap one when you reach it.</p></div></div></div>');
    pc.appendChild(pathBlock(area));
    root.appendChild(pc);

    /* --- today --- */
    var lc = el('<div class="card"><div class="card-head"><div><h2>Today</h2>' +
      '<p class="sub">How it feels, the move you made, and what the day was like.</p></div></div></div>');
    lc.appendChild(logBlock(area, {}));
    root.appendChild(lc);

    /* --- findings --- */
    var f = findings(area);
    var fc = el('<div class="card"><div class="card-head"><div><h2>Findings</h2>' +
      '<p class="sub">What your own entries are saying, updated as you log.</p></div></div></div>');
    if (f.length) {
      f.forEach(function (x) {
        fc.appendChild(el('<div class="finding"><span class="tone ' + x.tone + '"></span>' +
          '<span>' + esc(x.text) + '</span></div>'));
      });
    } else {
      fc.appendChild(el('<p class="empty">Nothing conclusive yet. Log a few more days and findings will appear here.</p>'));
    }
    root.appendChild(fc);

    /* --- background --- */
    var hc = el('<div class="card"><div class="card-head"><div><h2>Background &amp; history</h2>' +
      '<p class="sub">Injuries, surgeries, dates — the context a clinician would want.</p></div></div>' +
      '<textarea class="h-text" rows="6" placeholder="what happened, when, and what has changed since"></textarea></div>');
    var hta = hc.querySelector('textarea');
    hta.value = area.history || '';
    hta.addEventListener('change', function () { area.history = hta.value; save(); });
    root.appendChild(hc);


    /* --- trends --- */
    var rated = areaMetrics(area);
    var d14 = lastDays(14);
    var tc = el('<div class="card"><div class="card-head"><div><h2>Over time</h2>' +
      '<p class="sub">Last 14 days.</p></div></div></div>');

    var bars = el('<div class="bars"></div>'), xs = el('<div class="bars-x"></div>');
    d14.forEach(function (k) {
      var v = areaDayCompletion(area, k);
      var col = el('<div><span style="height:' + Math.round(Math.min(1, v) * 100) + '%;background:' + esc(area.color) + '"></span></div>');
      col.title = k + ' — ' + pct(Math.min(1, v)) + '%';
      bars.appendChild(col);
      xs.appendChild(el('<span>' + weekdayShort(k) + '</span>'));
    });
    tc.appendChild(el('<h3 class="section" style="margin-top:0">Moves made</h3>'));
    tc.appendChild(bars); tc.appendChild(xs);

    if (rated.length) {
      tc.appendChild(el('<h3 class="section">Ratings</h3>'));
      rated.forEach(function (m) {
        var vals = d14.map(function (k) { return (S.metrics[k] || {})[m.id]; });
        var known = vals.filter(function (v) { return typeof v === 'number'; });
        var a = metricAvg(m.id, days), b = metricAvg(m.id, prevWeek());
        var desc = 'no ratings yet', cls = 'flat', label = '—';
        if (a != null) {
          label = a.toFixed(1);
          desc = '7-day average out of 10';
          if (b != null) {
            var diff = a - b;
            var better = m.lowerIsBetter ? diff < 0 : diff > 0;
            desc = b.toFixed(1) + ' → ' + a.toFixed(1) + (Math.abs(diff) < 0.2 ? ' · steady' : (better ? ' · better' : ' · worse'));
            cls = Math.abs(diff) < 0.2 ? 'flat' : (better ? 'up' : 'down');
          }
        }
        var filled = [], last = 5;
        vals.forEach(function (v) { if (typeof v === 'number') last = v; filled.push(last); });
        tc.appendChild(el(
          '<div class="trend"><div style="flex:none">' + (known.length ? sparkline(filled, esc(area.color), m.lowerIsBetter) : '<div style="width:120px"></div>') + '</div>' +
          '<div class="grow"><div class="name">' + esc(m.label) + '</div><div class="desc">' + esc(desc) + '</div></div>' +
          '<div class="delta ' + cls + '">' + label + '</div></div>'
        ));
      });
    }
    root.appendChild(tc);

    /* --- notes mentioning this area's days --- */
    var recent = lastDays(14).slice().reverse().filter(function (k) { return (S.notes[k] || '').trim(); });
    if (recent.length) {
      var nc = el('<div class="card"><div class="card-head"><div><h2>Recent notes</h2>' +
        '<p class="sub">Your own words, last 14 days.</p></div></div></div>');
      recent.slice(0, 8).forEach(function (k) {
        nc.appendChild(el('<div class="trend"><div class="grow"><div class="desc">' + esc(k) + '</div>' +
          '<div class="name">' + esc(S.notes[k]) + '</div></div></div>'));
      });
      root.appendChild(nc);
    }

    root.appendChild(summaryCard(area));
    root.appendChild(setupCard(area));
  }

  /* how much of this area's own daily share was covered on a given day */
  function areaDayCompletion(area, dayKey) {
    var earned = 0, expected = 0;
    area.actions.forEach(function (act) {
      expected += (Math.max(1, act.coins || 1) * Math.max(1, act.target || 1)) / 7;
      if (isDone(dayKey, act.id)) earned += Math.max(1, act.coins || 1);
    });
    return expected ? Math.min(1.2, earned / expected) : 0;
  }

  /* ------------------------------------------------- summary for a clinician */

  function summaryCard(area) {
    var who = area ? 'this profile' : 'every profile';
    var card = el('<div class="card"><div class="card-head"><div><h2>Take it to an appointment</h2>' +
      '<p class="sub">Everything the tracker knows about ' + who + ', as plain text — background, ' +
      'ratings with 7- and 30-day averages, what you did, and how tagged days compare.</p></div></div>' +
      '<textarea class="s-text" readonly rows="8"></textarea>' +

    card.querySelector('.s-copy').addEventListener('click', function (e) {
      var btn = e.target;

      if (navigator.clipboard && navigator.clipboard.writeText) {

          btn.textContent = 'Copied';
          setTimeout(function () { btn.textContent = 'Copy'; }, 1800);
        }, function () { btn.textContent = 'Select all and copy'; });
      } else {
        btn.textContent = 'Select all and copy';

    card.querySelector('.s-save').addEventListener('click', function () {
      offerDownload('growth-rings-' + (area ? shortName(area.name).toLowerCase().replace(/[^a-z0-9]+/g, '-') : 'summary') +
        '-' + today() + '.txt', sText.value);

    return card;
  }

  function appointmentSummary(only) {
    var L = [], t = today();
    L.push('Growth Rings — summary prepared ' + t);
    L.push('Self-tracked by the patient. Not a clinical record.');

    S.areas.filter(function (a) { return !only || a.id === only.id; }).forEach(function (area) {
      L.push('');
      L.push('=== ' + area.name + ' ===');
      if (area.goal) L.push('Goal: ' + area.goal);
      if (area.vision) L.push('What healthy looks like: ' + area.vision.replace(/\s+/g, ' '));
      if (area.note) L.push(area.note);
      if (area.history) { L.push(''); L.push(area.history); }
      if (area.milestones.length) {
        L.push('');
        L.push('Milestones');
        area.milestones.forEach(function (m) {
          L.push('  ' + (m.done ? '[reached' + (m.doneAt ? ' ' + m.doneAt : '') + '] ' : '[ ] ') + m.label);
        });
      }

      var rated = areaMetrics(area);
      if (rated.length) {
        L.push('');
        L.push('Daily 0–10 ratings');
        rated.forEach(function (m) {
          var now = (S.metrics[t] || {})[m.id];
          var a7 = metricAvg(m.id, lastDays(7));
          var a30 = metricAvg(m.id, lastDays(30));
          var note = (typeof now === 'number') ? standoutNote(m, now) : null;
          L.push('  - ' + m.label + ' (' + (m.lowerIsBetter ? '0 best, 10 worst' : '0 worst, 10 best') + '): ' +
            'today ' + (typeof now === 'number' ? now : 'not rated') +
            ', 7-day avg ' + (a7 == null ? '—' : a7.toFixed(1)) +
            ', 30-day avg ' + (a30 == null ? '—' : a30.toFixed(1)) +
            (note ? ' — ' + note.text : ''));
        });
      }

      if (area.actions.length) {
        var d14 = lastDays(14);
        L.push('');
        L.push('What was done, last 14 days');
        area.actions.forEach(function (act) {
          L.push('  - ' + act.label + ': ' + hits(act.id, d14) + ' of ' + (act.target * 2) + ' planned');
        });
      }

      var tagged = area.flags.filter(function (f) {
        return Object.keys(S.flags).some(function (d) { return S.flags[d][f.id]; });
      });
      if (tagged.length) {
        L.push('');
        L.push('Days tagged (all history)');
        tagged.forEach(function (f) {
          var n = Object.keys(S.flags).filter(function (d) { return S.flags[d][f.id]; });
          var last = n.slice().sort().pop();
          L.push('  - ' + f.label + ': ' + n.length + (n.length === 1 ? ' day' : ' days') + ', most recently ' + last);
        });
      }

      var pats = computePatterns().filter(function (p) { return p.area.id === area.id; });
      var shown = [];
      pats.forEach(function (p) {
        var r = patternLine(p);
        if (r.enough) shown.push('  - ' + p.name + ': ' + r.desc + ' (' + r.label + ')');
      });
      if (shown.length) {
        L.push('');
        L.push('Ratings on tagged days vs other days');
        shown.forEach(function (x) { L.push(x); });
      }
    });

    var notes = [];
    Object.keys(S.notes).forEach(function (d) { if ((S.notes[d] || '').trim()) notes.push(d); });
    notes.sort().reverse();
    if (notes.length) {
      L.push('');
      L.push('=== Recent notes ===');
      notes.slice(0, 20).forEach(function (d) { L.push('  ' + d + ' — ' + S.notes[d].replace(/\s+/g, ' ')); });
    }

    return L.join('\n');
  }

  function offerDownload(name, text) {
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(function (dl) {
        if (dl) dl.save({ filename: name, data: text }).catch(function () { /* declined */ });
        else anchorSave(name, text);
      }).catch(function () { anchorSave(name, text); });
    } else {
      anchorSave(name, text);
    }
  }

  /* ------------------------------------------------------------ install */
  /* Served from the website, the page can be installed as an app: Chrome and
     Edge offer a prompt, Safari has File › Add to Dock (Mac) or Share › Add to
     Home Screen (iPhone). The artifact copy has no manifest and skips all this. */

  var installPrompt = null;
  var installable = !!document.querySelector('link[rel="manifest"]');
  var standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

  if (installable && 'serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(function () { /* still works online */ });
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    installPrompt = e;
    renderInstall();
  });
  window.addEventListener('appinstalled', function () { installPrompt = null; standalone = true; renderInstall(); });

  function renderInstall() {
    var slot = document.getElementById('installSlot');
    if (!slot) return;
    slot.innerHTML = '';
    if (!installPrompt || standalone) return;
    var b = el('<button class="btn primary install-btn" type="button">Install app</button>');
    b.addEventListener('click', function () {
      installPrompt.prompt();
      installPrompt.userChoice.then(function () { installPrompt = null; renderInstall(); });
    });
    slot.appendChild(b);
  }

  function installHelp() {
    if (!installable || standalone) return null;
    return el('<div><h3 class="section">Get the app</h3>' +
      '<p class="muted" style="margin:-4px 0 0;line-height:1.7">' +
      '<b>Mac, Chrome or Edge:</b> the Install button at the top, or the install icon at the right of the address bar.<br>' +
      '<b>Mac, Safari:</b> File › Add to Dock.<br>' +

      '<div class="btnrow"><button class="btn d-export">Export backup</button>' +
      '<button class="btn d-import">Import backup</button>' +
      '<button class="btn ghost d-reset">Reset everything</button></div>' +
      '<input type="file" accept="application/json" class="d-file" hidden>' +
      '<div class="sync"><span class="dot"></span><span class="sync-text"></span></div></div>');
    data.querySelector('.sync-text').textContent = SYNC_TEXT[syncState] || SYNC_TEXT.local;
    data.querySelector('.sync').classList.toggle('on', syncState === 'synced');
    data.querySelector('.d-export').addEventListener('click', function () {
